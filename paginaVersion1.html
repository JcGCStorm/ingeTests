<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Movies - Películas Recientes</title>
    <style>
        /* Estilos generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        /* Encabezado */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e50914;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background-color: #222;
            border-radius: 20px;
            padding: 8px 15px;
            width: 300px;
        }

        .search-bar input {
            background: none;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            margin-left: 10px;
        }

        .user-menu {
            display: flex;
            align-items: center;
        }

        .user-menu span {
            font-size: 20px;
            margin-left: 20px;
            cursor: pointer;
        }

        /* Contenedor de películas */
        .movies-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Tarjetas de películas */
        .movie-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            background-color: #1a1a1a;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
            background-color: #1a1a1a;
        }

        .movie-title {
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-details {
            font-size: 14px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }

        .hd-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #e50914;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #222;
            border-radius: 10px;
            width: 80%;
            max-width: 800px;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .modal-poster {
            width: 40%;
            object-fit: cover;
        }

        .modal-info {
            padding: 30px;
            width: 60%;
        }

        .modal-title {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .modal-details {
            margin-bottom: 20px;
        }

        .modal-details p {
            margin-bottom: 8px;
            color: #ccc;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #e50914;
            color: white;
        }

        .btn-primary:hover {
            background-color: #c40812;
        }

        .btn-secondary {
            background-color: #444;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #555;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .close-modal:hover {
            color: white;
        }

        .rating {
            color: #ffd700;
            margin-right: 5px;
        }

        /* Diseño responsivo */
        @media (max-width: 768px) {
            .modal-content {
                flex-direction: column;
                width: 95%;
            }

            .modal-poster, .modal-info {
                width: 100%;
            }

            .search-bar {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Latest Movies</div>
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" placeholder="Buscar películas...">
        </div>
        <div class="user-menu">
            <span>🔔</span>
            <span>👤</span>
        </div>
    </div>

    <div class="movies-container" id="moviesContainer">
        <!-- Las películas se cargarán aquí mediante JavaScript -->
    </div>

    <div class="modal" id="movieModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <img src="" alt="Movie Poster" class="modal-poster" id="modalPoster">
            <div class="modal-info">
                <h2 class="modal-title" id="modalTitle"></h2>
                <div class="modal-details">
                    <p><span class="rating">⭐ <span id="modalRating"></span></span></p>
                    <p><strong>Año:</strong> <span id="modalYear"></span></p>
                    <p><strong>Duración:</strong> <span id="modalDuration"></span></p>
                    <p><strong>País:</strong> <span id="modalCountry"></span></p>
                    <p><strong>Género:</strong> <span id="modalGenre"></span></p>
                    <p id="modalDescription"></p>
                </div>
                <div class="modal-buttons">
                    <button class="btn btn-primary">Watch Now</button>
                    <button class="btn btn-secondary">❤️ Añadir a favoritos</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Datos de películas
        const movies = [
            {
                id: 1,
                title: "Playdate",
                year: 2023,
                duration: "1h 45m",
                country: "Estados Unidos",
                genre: "Comedia, Drama",
                rating: "7.2/10",
                description: "Una divertida comedia sobre una cita que se convierte en una aventura inesperada.",
                poster: "https://picsum.photos/seed/playdate/300/450.jpg",
                hd: true
            },
            {
                id: 2,
                title: "Black Phone 2",
                year: 2023,
                duration: "2h 10m",
                country: "Estados Unidos",
                genre: "Terror, Thriller",
                rating: "6.8/10",
                description: "La secuela del aclamado thriller de terror que te mantendrá al borde de tu asiento.",
                poster: "https://picsum.photos/seed/blackphone2/300/450.jpg",
                hd: true
            },
            {
                id: 3,
                title: "The Fantastic Four: First Steps",
                year: 2024,
                duration: "2h 25m",
                country: "Estados Unidos",
                genre: "Acción, Aventura, Ciencia Ficción",
                rating: "7.5/10",
                description: "El legendario equipo de superhéroes regresa en una nueva aventura épica.",
                poster: "https://picsum.photos/seed/fantasticfour/300/450.jpg",
                hd: true
            },
            {
                id: 4,
                title: "Baramulla",
                year: 2023,
                duration: "2h 5m",
                country: "India",
                genre: "Drama, Guerra",
                rating: "8.1/10",
                description: "Una conmovedora historia ambientada en la región de Baramulla, Kashmir.",
                poster: "https://picsum.photos/seed/baramulla/300/450.jpg",
                hd: false
            },
            {
                id: 5,
                title: "Echoes of Time",
                year: 2023,
                duration: "1h 55m",
                country: "Reino Unido",
                genre: "Drama, Ciencia Ficción",
                rating: "7.0/10",
                description: "Un viaje a través del tiempo que desafía las leyes de la física y el destino.",
                poster: "https://picsum.photos/seed/echoesoftime/300/450.jpg",
                hd: true
            },
            {
                id: 6,
                title: "The Last Horizon",
                year: 2024,
                duration: "2h 30m",
                country: "Estados Unidos",
                genre: "Aventura, Drama",
                rating: "7.8/10",
                description: "Una expedición a lo desconocido que revelará los secretos más profundos de la humanidad.",
                poster: "https://picsum.photos/seed/lasthorizon/300/450.jpg",
                hd: true
            },
            {
                id: 7,
                title: "Neon Dreams",
                year: 2023,
                duration: "1h 50m",
                country: "Japón",
                genre: "Animación, Ciencia Ficción",
                rating: "8.5/10",
                description: "Un espectacular anime que explora los límites entre la realidad y los sueños.",
                poster: "https://picsum.photos/seed/neondreams/300/450.jpg",
                hd: true
            },
            {
                id: 8,
                title: "Silent Waters",
                year: 2023,
                duration: "2h 15m",
                country: "Francia",
                genre: "Thriller, Misterio",
                rating: "7.3/10",
                description: "Un misterio profundo que se esconde bajo las aguas tranquilas de un lago alpino.",
                poster: "https://picsum.photos/seed/silentwaters/300/450.jpg",
                hd: false
            }
        ];

        // Función para cargar las películas
        function loadMovies() {
            const moviesContainer = document.getElementById('moviesContainer');

            movies.forEach(movie => {
                const movieCard = document.createElement('div');
                movieCard.className = 'movie-card';
                movieCard.dataset.id = movie.id;

                movieCard.innerHTML = `
                    ${movie.hd ? '<div class="hd-badge">HD</div>' : ''}
                    <img src="${movie.poster}" alt="${movie.title}" class="movie-poster">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-details">
                            <span>${movie.year}</span>
                            <span>${movie.duration}</span>
                        </div>
                    </div>
                `;

                movieCard.addEventListener('click', () => openMovieModal(movie));
                moviesContainer.appendChild(movieCard);
            });
        }

        // Función para abrir el modal con detalles de la película
        function openMovieModal(movie) {
            const modal = document.getElementById('movieModal');

            document.getElementById('modalPoster').src = movie.poster;
            document.getElementById('modalTitle').textContent = movie.title;
            document.getElementById('modalRating').textContent = movie.rating;
            document.getElementById('modalYear').textContent = movie.year;
            document.getElementById('modalDuration').textContent = movie.duration;
            document.getElementById('modalCountry').textContent = movie.country;
            document.getElementById('modalGenre').textContent = movie.genre;
            document.getElementById('modalDescription').textContent = movie.description;

            modal.style.display = 'flex';
        }

        // Función para cerrar el modal
        function closeModal() {
            document.getElementById('movieModal').style.display = 'none';
        }

        // Event listeners
        document.getElementById('closeModal').addEventListener('click', closeModal);

        window.addEventListener('click', (event) => {
            const modal = document.getElementById('movieModal');
            if (event.target === modal) {
                closeModal();
            }
        });

        // Cargar películas al iniciar la página
        document.addEventListener('DOMContentLoaded', loadMovies);
    </script>
</body>
</html>
